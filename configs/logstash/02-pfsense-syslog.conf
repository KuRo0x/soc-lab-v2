# Logstash Pipeline — pfSense Syslog + Suricata EVE (via syslog)
# Port: 5140 (UDP + TCP)
# Receives: pfSense system/firewall logs AND Suricata EVE JSON (when EVE Output Type = SYSLOG)
# Credentials: stored in password manager (never commit real values)
# Note: FreeBSD syslog truncates messages >480 bytes — long EVE events may parse-fail

input {
  syslog {
    port => 5140
    type => "pfsense"
  }
}

filter {
  if [type] == "pfsense" {
    mutate {
      add_tag => ["pfsense", "firewall"]
    }

    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP} %{SYSLOGHOST} %{DATA}(?:\[%{POSINT}\])?: %{GREEDYDATA:syslog_msg}" }
      tag_on_failure => ["_grok_failure"]
    }

    if [syslog_msg] =~ /\{.*\"event_type\"/ {
      json {
        source => "syslog_msg"
        target => "suricata"
      }
      mutate {
        add_tag => ["suricata"]
        replace => { "type" => "suricata" }
      }
    }
  }
}

output {
  if "suricata" in [tags] {
    elasticsearch {
      hosts => ["https://localhost:9200"]
      index => "suricata-%{+YYYY.MM.dd}"
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_verification_mode => none
    }
  } else if [type] == "pfsense" {
    elasticsearch {
      hosts => ["https://localhost:9200"]
      index => "pfsense-firewall-%{+YYYY.MM.dd}"
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_verification_mode => none
    }
  }
}
