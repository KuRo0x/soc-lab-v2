# Logstash Pipeline — pfSense Syslog Input
# Credentials: stored in password manager (never commit real values)

input {
  syslog {
    port => 5140
    type => "pfsense"
  }
}

filter {
  if [type] == "pfsense" {
    mutate {
      add_tag => ["pfsense", "firewall"]
    }
  }
}

output {
  if [type] == "pfsense" {
    elasticsearch {
      hosts => ["https://localhost:9200"]
      index => "pfsense-firewall-%{+YYYY.MM.dd}"
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_verification_mode => none
    }
  }
}
