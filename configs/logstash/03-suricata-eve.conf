# Logstash Pipeline — Suricata EVE JSON (direct TCP)
# Port: 5045 (TCP, json_lines codec)
# Receives: Suricata EVE JSON forwarded directly (e.g. via nc pipe or future Filebeat)
# Index: suricata-eve-YYYY.MM.dd
# Credentials: stored in password manager (never commit real values)

input {
  tcp {
    port => 5045
    codec => json_lines
    type => "suricata_eve"
  }
}

filter {
  if [type] == "suricata_eve" {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  if [type] == "suricata_eve" {
    elasticsearch {
      hosts => ["https://localhost:9200"]
      index => "suricata-eve-%{+YYYY.MM.dd}"
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled => true
      ssl_verification_mode => none
    }
  }
}
