# Logstash Pipeline — Beats Input (Winlogbeat / Filebeat)
# Credentials: stored in password manager (never commit real values)

input {
  beats {
    port => 5044
  }
}

filter {
  if "apache" in [tags] {
    mutate {
      copy => { "[source][address]" => "[source][ip]" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "%{[@metadata][beat]}-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_verification_mode => none
  }
}
