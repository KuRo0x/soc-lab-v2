# Logstash Pipeline — Beats Input (Winlogbeat / Filebeat)
# Fix applied 2026-08-26: remove winlog.event_data.ProcessCreationTime
# Winlogbeat 9.x sends this field in a non-standard date format that Elasticsearch rejects.
# Dropping it before indexing resolves document_parsing_exception (HTTP 400) errors.

input {
  beats {
    port => 5044
  }
}

filter {
  if "apache" in [tags] {
    mutate {
      copy => { "[source][address]" => "[source][ip]" }
    }
  }

  # Winlogbeat 9.x sends ProcessCreationTime as '2026-08-26 19:12:15.8807751 +0000 UTC'
  # which does not match Elasticsearch strict_date_optional_time||epoch_millis format.
  # This causes HTTP 400 document_parsing_exception and drops the entire event.
  # Solution: remove the field before indexing. It is not used in any detection rule.
  if [agent][type] == "winlogbeat" {
    mutate {
      remove_field => ["[winlog][event_data][ProcessCreationTime]"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "%{[@metadata][beat]}-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_verification_mode => none
  }
}
