###################### Winlogbeat Configuration — soc-lab-v2 (Win10 Victim) ########################
# Source: Pulled directly from Win10 Victim (172.16.0.10)
# Install path: C:\Users\SOC-Lab-Endpoint\Downloads\winlogbeat-9.4.2-windows-x86_64\winlogbeat-9.4.2-windows-x86_64\winlogbeat.yml
# Version: winlogbeat 9.4.2
# Output: Logstash on 172.16.0.4:5044
# ⚠️ TODO: Move install from Downloads to C:\Program Files\Winlogbeat\ and re-register service
# NOTE: Kibana host not yet configured — uncomment setup.kibana.host when ready

# ======================== Winlogbeat specific options =========================

winlogbeat.event_logs:
  - name: Application
    ignore_older: 72h

  - name: System

  - name: Security

  - name: Microsoft-Windows-Sysmon/Operational

  - name: Windows PowerShell
    event_id: 400, 403, 600, 800

  - name: Microsoft-Windows-PowerShell/Operational
    event_id: 4103, 4104, 4105, 4106

  - name: ForwardedEvents
    tags: [forwarded]

# ====================== Elasticsearch template settings =======================

setup.template.settings:
  index.number_of_shards: 1
  #index.codec: best_compression
  #_source.enabled: false

# =================================== Kibana ===================================

setup.kibana:
  # TODO: Uncomment and set when Kibana is reachable from Win10
  #host: "172.16.0.4:5601"

# ================================== Outputs ===================================

# ---------------------------- Elasticsearch Output ----------------------------
#output.elasticsearch:
