###################### Winlogbeat Configuration — soc-lab-v2 (Win10 Victim) ########################
# Host:         Win10 Victim (172.16.0.10)
# Install path: C:\Program Files\Winlogbeat\winlogbeat.yml
# Binary:       C:\Program Files\Winlogbeat\winlogbeat.exe
# Data:         C:\Program Files\Winlogbeat-Data\Winlogbeat
# Logs:         C:\Program Files\Winlogbeat-Data\Winlogbeat\logs
# Version:      winlogbeat 9.4.2
# Output:       Logstash on 172.16.0.4:5044
# Status:       ✅ Service running — verified 2026-08-20
# NOTE:         Kibana host not yet configured — uncomment setup.kibana.host when ready

# Service binary path (confirmed via Get-WmiObject Win32_Service):
# "C:\Program Files\Winlogbeat\winlogbeat.exe" --environment=windows_service
#   -c "C:\Program Files\Winlogbeat\winlogbeat.yml"
#   --path.home "C:\Program Files\Winlogbeat"
#   --path.data "C:\Program Files\Winlogbeat-Data\Winlogbeat"
#   --path.logs "C:\Program Files\Winlogbeat-Data\Winlogbeat\logs"
#   -E keystore.path="C:\Program Files\Winlogbeat\data\Winlogbeat.keystore"
#   -E logging.files.redirect_stderr=true

# ======================== Winlogbeat specific options =========================

winlogbeat.event_logs:
  - name: Application
    ignore_older: 72h

  - name: System

  - name: Security

  - name: Microsoft-Windows-Sysmon/Operational

  - name: Windows PowerShell
    event_id: 400, 403, 600, 800

  - name: Microsoft-Windows-PowerShell/Operational
    event_id: 4103, 4104, 4105, 4106

  - name: ForwardedEvents
    tags: [forwarded]

# ====================== Elasticsearch template settings =======================

setup.template.settings:
  index.number_of_shards: 1
  #index.codec: best_compression
  #_source.enabled: false

# =================================== Kibana ===================================

setup.kibana:
  # TODO: Uncomment and set when Kibana is reachable from Win10
  #host: "172.16.0.4:5601"

