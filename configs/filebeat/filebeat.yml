# ============================================================
# Filebeat Configuration — soc-lab-v2
# Host:     Ubuntu Victim (172.16.0.20)
# Hostname: soc-lab-victim
# OS:       Ubuntu 26.04 LTS (Resolute Raccoon)
# Version:  filebeat 8.19.17
# Output:   Logstash on 172.16.0.4:5044
# Status:   ✅ Config OK + output verified 2026-08-20
#
# Verified with:
#   sudo filebeat test config -e   -> Config OK
#   sudo filebeat test output -e   -> logstash: 172.16.0.4:5044
#                                      parse host OK | dns OK | dial OK | talk to server OK
#                                      TLS: WARN secure connection disabled (expected in lab)
#
# Paths:
#   config:  /etc/filebeat
#   data:    /var/lib/filebeat
#   home:    /usr/share/filebeat
#   logs:    /var/log/filebeat
#   binary:  /usr/share/filebeat/bin/filebeat
# ============================================================

filebeat.inputs:

  # System auth logs (brute force, SSH login events)
  - type: log
    enabled: true
    paths:
      - /var/log/auth.log
      - /var/log/secure
    fields:
      log_type: auth
      host_role: ubuntu-victim
    multiline.pattern: '^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)'
    multiline.negate: true
    multiline.match: after

  # Syslog — general system events
  - type: log
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/messages
    fields:
      log_type: syslog
      host_role: ubuntu-victim

  # Apache / Nginx access logs (disabled — enable when running web service)
  - type: log
    enabled: false
    paths:
      - /var/log/apache2/access.log
      - /var/log/nginx/access.log
    fields:
      log_type: webserver

  # Auditd logs (file access, syscall auditing)
  - type: log
    enabled: true
    paths:
      - /var/log/audit/audit.log
    fields:
      log_type: auditd
      host_role: ubuntu-victim

# ============================================================
# Modules
# ============================================================
filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# ============================================================
# Processors
# ============================================================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~

# ============================================================
# Output — Logstash
# ✅ Verified shipping to Logstash pipeline on ELK stack
# TLS disabled — acceptable for isolated 172.16.0.0/24 lab
# ============================================================
output.logstash:
  hosts: ["172.16.0.4:5044"]

  # Enable when TLS is configured on Logstash:
  #ssl.certificate_authorities: ["/etc/pki/root/ca.pem"]
  #ssl.certificate: "/etc/pki/client/cert.pem"
  #ssl.key: "/etc/pki/client/cert.key"

# Elasticsearch direct output (disabled — using Logstash pipeline instead)
# output.elasticsearch:
#   hosts: ["172.16.0.4:9200"]
#   username: "elastic"
#   password: "${ELASTIC_PASSWORD}"
#   index: "filebeat-%{[agent.version]}-%{+yyyy.MM.dd}"

# ============================================================
# Kibana
# ============================================================
setup.kibana:
  host: "172.16.0.4:5601"

setup.ilm.enabled: true
setup.template.settings:
  index.number_of_shards: 1

# ============================================================
# Logging
# ============================================================
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0640
